trigger:
  branches:
    include:
      - main

stages:
  - stage: DeployApp
    displayName: "Deploy EpicBook via Ansible"
    jobs:
      - job: App_Deployment
        displayName: "Run Ansible Playbook"
        pool:
          name: "linux-hosted-pool"

        steps:
          - checkout: self

          - script: |
              sudo apt update
              sudo apt install -y ansible sshpass
            displayName: "Install Ansible & SSH dependencies"

          - task: DownloadSecureFile@1
            name: download_ssh_key
            inputs:
              secureFile: "id_rsa"

          - script: |
              mkdir -p ~/.ssh
              cp $(download_ssh_key.secureFilePath) ~/.ssh/id_rsa
              chmod 600 ~/.ssh/id_rsa
              echo "StrictHostKeyChecking no" >> ~/.ssh/config
              chmod 600 ~/.ssh/config
            displayName: "Setup SSH Private Key"

          - script: |
              ansible-playbook -i $(Build.SourcesDirectory)/ansible/inventory.ini \
                               $(Build.SourcesDirectory)/ansible/site.yml \
                               --ssh-extra-args "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
            displayName: "Run Ansible Playbook"
            env:
              ANSIBLE_HOST_KEY_CHECKING: "False"
